name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'release/**' ]
  pull_request:
    branches: [ main, master, 'release/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  # Fixed values for the ephemeral CI database/cache — these are not read from
  # repository secrets; CI never talks to production infrastructure.
  DATABASE_URL: "postgresql://devuser:devpassword@localhost:5432/birthvoices"
  REDIS_URL: "redis://localhost:6379"
  ALLOWED_ORIGINS: "http://127.0.0.1:3000,http://localhost:3000"
  JWT_SECRET: "ci_jwt_secret_do_not_use_in_production"
  REFRESH_TOKEN_SECRET: "ci_refresh_secret_do_not_use_in_production"
  # Lets e2e/atlasgr-webhook.spec.ts exercise the real signature-check path (missing/wrong secret
  # -> 401) instead of the "integration not configured" fallback (-> 503) — matching what a real
  # deployment (which does have this configured) actually enforces. Not a real secret; CI never
  # talks to the real AtlasGR CRM.
  ATLASGR_WEBHOOK_SECRET: "ci_atlasgr_webhook_secret_do_not_use_in_production"
  NODE_ENV: "test"

jobs:
  validate-and-build:
    name: Validate, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: birthvoices
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Runtime Dependency Audit
      # Audit the same root runtime dependency set copied into the Cloud Run image. Experimental
      # workspaces such as packages/sip-agent are not shipped by the production Docker stage.
      run: npm audit --omit=dev --workspaces=false --audit-level=high

    - name: Prisma Generate
      run: npx prisma generate

    - name: Prisma Migrate Check
      run: npx prisma migrate deploy

    - name: Prisma Seed
      run: npx prisma db seed

    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Run Tests
      run: npm run test

    - name: Build Application
      run: npm run build

    - name: Install Chromium for Playwright
      run: npx playwright install --with-deps chromium

    - name: Browser Smoke Tests
      run: npm run test:e2e

    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
        if-no-files-found: ignore

  docker-build:
    name: Docker Build Artifact
    runs-on: ubuntu-latest
    needs: validate-and-build
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Build Docker Image
      run: docker build -t birthvoices-app:${{ github.sha }} .

    # The image build succeeding is not proof the image actually runs — Alpine/Prisma engine
    # mismatches, missing runtime files from the multi-stage copy, or a broken CMD only surface
    # once the container is actually started. Run it for real and hit the same /health endpoint
    # Cloud Run's own health check calls (see Dockerfile HEALTHCHECK), failing the job if it
    # never comes up healthy.
    - name: Start container and verify /health
      run: |
        set -e
        # NODE_ENV=production, not "test": server.ts only calls server.listen() (and starts the
        # webhook worker / schedulers) when NODE_ENV !== 'test' — that guard exists so `vitest`
        # (which imports `appPromise` directly, never over HTTP) doesn't bind a real port or start
        # background workers. A smoke test that actually curls the container over HTTP needs the
        # real listening server, i.e. the same NODE_ENV Cloud Run itself runs with (see deploy.yml).
        docker run -d --name ci-smoke -p 3000:3000 \
          -e NODE_ENV=production \
          -e PORT=3000 \
          -e DATABASE_URL="postgresql://devuser:devpassword@localhost:5432/birthvoices" \
          -e REDIS_URL="redis://localhost:6379" \
          -e JWT_SECRET="ci_jwt_secret_do_not_use_in_production" \
          -e REFRESH_TOKEN_SECRET="ci_refresh_secret_do_not_use_in_production" \
          -e ALLOWED_ORIGINS="http://127.0.0.1:3000,http://localhost:3000" \
          birthvoices-app:${{ github.sha }}

        echo "Waiting for container to report healthy (Dockerfile HEALTHCHECK)..."
        for i in $(seq 1 40); do
          status="$(docker inspect --format='{{.State.Health.Status}}' ci-smoke 2>/dev/null || echo 'starting')"
          echo "  [$i/40] health status: $status"
          if [ "$status" = "healthy" ]; then
            break
          fi
          if [ "$status" = "unhealthy" ]; then
            echo "::error::Container reported unhealthy."
            docker logs ci-smoke || true
            exit 1
          fi
          sleep 2
        done

        if [ "$status" != "healthy" ]; then
          echo "::error::Container never became healthy within timeout."
          docker logs ci-smoke || true
          exit 1
        fi

        echo "Hitting /health directly as an extra check..."
        curl --fail --show-error --silent http://127.0.0.1:3000/health

    - name: Dump container logs
      if: always()
      run: docker logs ci-smoke || true

    - name: Stop and remove smoke test container
      if: always()
      run: docker rm -f ci-smoke || true
