receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 384

exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:9464

service:
  # Internal self-telemetry (otelcol_receiver_accepted_spans_total, otelcol_exporter_sent_spans_total,
  # otelcol_exporter_send_failed_spans_total, otelcol_exporter_queue_size, ...) — real data as soon
  # as any span/log/metric flows through the collector, unlike the "prometheus" exporter above
  # which stays empty until the app exports custom metrics. Bound to 0.0.0.0 (not the loopback-only
  # default) so prometheus.yml's otel-collector-internal job can scrape it across the Docker network.
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
