  /developers/keys:
    post:
      tags: [ApiKeys]
      summary: Create a new tenant API key
      description: >
        Admin-only, tenant-scoped (`requireTenant` + `requireRole(['admin'])` — same
        authorization level as `/users` and `/billing/*`; a leaked or over-issued key is a
        security incident, not a routine self-service action for every role). The plaintext
        `key` in the `201` response is present **exactly once, only in this response** — it is
        SHA-256 hashed before being persisted and can never be retrieved again afterwards. If
        the caller loses it, the only remedy is to revoke this key and create a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Human-readable label for the key (e.g. "CI pipeline", "Zapier integration").
                expiresAt:
                  type: string
                  format: date-time
                  description: Optional ISO 8601 expiration. Omitted/absent means the key never expires.
      responses:
        '201':
          description: Key created. Copy `key` now — the server will never return it again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      expiresAt:
                        type: string
                        format: date-time
                        nullable: true
                  key:
                    type: string
                    example: 'bvhk_live_9f2c...'
                    description: >
                      Plaintext secret. Present only in this response — not stored anywhere in
                      recoverable form, never logged, never returned by `GET /developers/keys`
                      or any other endpoint.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [ApiKeys]
      summary: List the tenant's API keys
      description: Admin-only. Metadata only — never includes the hash or the plaintext key.
      responses:
        '200':
          description: The tenant's API keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKeys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKeyMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /developers/keys/{id}:
    delete:
      tags: [ApiKeys]
      summary: Revoke an API key
      description: >
        Admin-only. Alias of `POST /developers/keys/{id}/revoke` — same controller, same audit
        action (`API_KEY_REVOKE`). Tenant-scoped lookup: a key belonging to another tenant is
        indistinguishable from a nonexistent one (`404`). Idempotent — revoking an
        already-revoked key returns `200` rather than an error.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  apiKey:
                    $ref: '#/components/schemas/ApiKeyMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /developers/keys/{id}/revoke:
    post:
      tags: [ApiKeys]
      summary: Revoke an API key (explicit-verb alias)
      description: >
        Identical behavior to `DELETE /developers/keys/{id}` — provided for callers/UIs that
        prefer an explicit action verb over the `DELETE` HTTP method.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  apiKey:
                    $ref: '#/components/schemas/ApiKeyMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /developers/webhooks:
    post:
      tags: [WebhookEndpoints]
      summary: Create a new tenant-scoped webhook endpoint
      description: >
        Admin-only, tenant-scoped (`requireTenant` + `requireRole(['admin'])` — same
        authorization level as `/developers/keys` and `/billing/*`; a tenant webhook endpoint
        receives real event payloads, call outcomes and lead data, signed with a secret only the
        creating tenant should ever see). Rejects the 6th active endpoint for the tenant rather
        than silently failing or evicting an existing one (`409`) — the limit is 5 active
        endpoints per tenant.

        The plaintext `secret` (`whsec_...`) in the `201` response is present **exactly once,
        only in this response** — it is SHA-256 hashed before being persisted (that hash also
        doubles as the actual HMAC-SHA256 signing key used for every future delivery to this
        endpoint) and can never be retrieved again afterwards, by this endpoint or any other. If
        the caller loses it, the only remedy is `POST /developers/webhooks/{id}/regenerate-secret`,
        which invalidates the old secret and mints a new one — there is no "reveal again" path.

        Backed by the real `TenantWebhookEndpoint` Prisma model (see
        `.agents/handoffs/onda-5/01-para-05-schema-webhook-endpoint-pronto.md`) — persistence is
        live, this is not a scaffold. `503` (see that response below) is returned only if the
        underlying persistence layer is genuinely unavailable at request time (e.g. a database
        outage), never as this route's normal behavior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                  description: Must be a public HTTPS URL (SSRF-guarded — cannot point at a private/reserved/internal host).
                  example: 'https://example.com/webhooks/birth-voices'
                events:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                  description: Event types to receive (e.g. `["call.completed"]`), or `["*"]` for all.
      responses:
        '201':
          description: Endpoint created. Copy `secret` now — the server will never return it again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookEndpoint:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        format: uri
                      events:
                        type: array
                        items:
                          type: string
                      active:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                  secret:
                    type: string
                    example: 'whsec_9f2c...'
                    description: >
                      Plaintext signing secret. Present only in this response — not stored
                      anywhere in recoverable form, never logged, never returned by
                      `GET /developers/webhooks` or any other endpoint. To verify a delivery
                      signature, SHA-256-hash this value first and use that hex digest as the
                      HMAC-SHA256 key — the platform never stores the plaintext itself.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The tenant already has 5 active webhook endpoints (the maximum). Remove or deactivate one before creating another.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >
            The persistence layer backing tenant-scoped webhook endpoints is temporarily
            unavailable (e.g. a database outage). Never returned as a fabricated empty success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [WebhookEndpoints]
      summary: List the tenant's webhook endpoints
      description: >
        Admin-only. Metadata only (`url`, `events`, `active`, delivery bookkeeping) — never
        includes the secret or its hash. See `POST /developers/webhooks` for the persistence
        scaffold note (`503`).
      responses:
        '200':
          description: The tenant's webhook endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookEndpoints:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpointMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: The persistence layer backing tenant-scoped webhook endpoints is temporarily unavailable (e.g. a database outage). Never returned as a fabricated empty success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /developers/webhooks/{id}:
    delete:
      tags: [WebhookEndpoints]
      summary: Delete a webhook endpoint
      description: >
        Admin-only. Tenant-scoped lookup: an endpoint belonging to another tenant is
        indistinguishable from a nonexistent one (`404`) — an admin from tenant A can never
        delete, or even discover the existence of, an endpoint belonging to tenant B. See
        `POST /developers/webhooks` for the persistence scaffold note (`503`).
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The persistence layer backing tenant-scoped webhook endpoints is temporarily unavailable (e.g. a database outage). Never returned as a fabricated empty success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /developers/webhooks/{id}/regenerate-secret:
    post:
      tags: [WebhookEndpoints]
      summary: Invalidate the current secret and mint a new one
      description: >
        Admin-only. The only way to get a working secret again after the one-time reveal at
        creation: invalidates the endpoint's current signing secret and mints a new one, returned
        in plaintext exactly once in this response, same rule as `POST /developers/webhooks` —
        there is no "reveal again" path anywhere in this API. Tenant-scoped lookup, same
        cross-tenant `404` behavior as `DELETE /developers/webhooks/{id}`. See
        `POST /developers/webhooks` for the persistence scaffold note (`503`).
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '200':
          description: Secret regenerated. Copy `secret` now — the server will never return it again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookEndpoint:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        format: uri
                      events:
                        type: array
                        items:
                          type: string
                      active:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                  secret:
                    type: string
                    example: 'whsec_9f2c...'
                    description: >
                      New plaintext signing secret. Present only in this response; the old secret
                      stops working immediately. Same non-recoverability guarantee as the `secret`
                      field of `POST /developers/webhooks`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The persistence layer backing tenant-scoped webhook endpoints is temporarily unavailable (e.g. a database outage). Never returned as a fabricated empty success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /billing/summary:
    get:
      tags: [Billing]
      summary: Wallet balance and current plan
      description: >
        Admin-only. `wallet: null` is a real, explicit empty state (tenant never onboarded to
        billing, no `Wallet` row yet) — not an error; render it as an empty state, never a
        fabricated zero-balance wallet.
      responses:
        '200':
          description: Wallet summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    allOf:
                      - $ref: '#/components/schemas/WalletSummary'
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /billing/transactions:
    get:
      tags: [Billing]
      summary: Paginated transaction history
      description: Admin-only. Tenant-scoped (`req.tenantId`, never a query param), ordered newest-first.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number. Non-numeric or out-of-range values fall back to `1`.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Entries per page, clamped to `[1, 100]`. Non-numeric values fall back to the default.
      responses:
        '200':
          description: Page of transactions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionSummary'
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /billing/plans:
    get:
      tags: [Billing]
      summary: List available subscription plans
      description: >
        Any authenticated tenant member — not admin-gated, unlike the other `/billing/*`
        endpoints, since this is a read-only global catalog (same list for every tenant), not
        tenant-specific data.
      responses:
        '200':
          description: Active plan catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanOption'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /billing/change-plan:
    post:
      tags: [Billing]
      summary: Upgrade or downgrade the tenant's plan
      description: >
        Admin-only. Only `effectiveAt: "immediate"` is implemented: `Wallet` has no
        `currentPeriodStart`, so there is no way to compute a prorated amount or a "next cycle"
        date — a request with `effectiveAt: "next_cycle"` gets an explicit `400`
        (`ProrationNotSupportedError`), never a silent fallback to immediate. On success, also
        raises an in-app notification for the acting admin (best-effort — a failure to notify
        never fails the plan change itself, which has already committed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:
                  type: string
                effectiveAt:
                  type: string
                  enum: [immediate, next_cycle]
                  default: immediate
                  description: '`next_cycle` is accepted by the schema but rejected with `400` — see description above.'
      responses:
        '200':
          description: Plan changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    $ref: '#/components/schemas/WalletSummary'
        '400':
          description: Validation error, or `effectiveAt=next_cycle` (not supported — see `ProrationNotSupportedError`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`planId` does not exist or is inactive.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notifications:
    get:
      tags: [Notifications]
      summary: Paginated notification feed for the caller
      description: >
        Scoped to `req.user.id` (never a query/body param) — not admin-gated, unlike
        `/billing/*` and `/developers/keys`: any authenticated tenant member reads and manages
        only their own notifications. Includes `unreadCount` for the bell-badge UI.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number. Non-numeric or out-of-range values fall back to `1`.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Entries per page, clamped to `[1, 100]`. Non-numeric values fall back to the default.
      responses:
        '200':
          description: Page of notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationSummary'
                  unreadCount:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark one notification as read
      description: >
        Ownership is verified against `req.user.id` inside the service/repository layer; a
        notification belonging to another user resolves to the same `404` as one that does not
        exist at all — never reveals that a resource exists in someone else's account.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '200':
          description: Marked read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification:
                    $ref: '#/components/schemas/NotificationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all of the caller's notifications as read
      description: Bulk action for the notification panel's header ("mark all as read").
      responses:
        '200':
          description: Marked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedCount:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chat:
    post:
      tags: [AI]
      summary: Send a message to the AI Gateway (Playground)
      description: >
        Routed through `LLMGateway.processRequest`, which performs the tenant-scoped AI-provider
        consent check and provider failover chain (preferred provider → Gemini as guaranteed
        fallback) — the same gateway every other AI-Gateway caller uses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentMessages]
              properties:
                prompt:
                  type: string
                  description: Optional system prompt override.
                currentMessages:
                  type: array
                  items:
                    type: object
                    required: [role, text]
                    properties:
                      role:
                        type: string
                        enum: [user, agent]
                      text:
                        type: string
      responses:
        '200':
          description: >
            Gateway response. `providerUsed: "NONE"` covers two distinct cases distinguishable by
            `blockedByConsent`: tenant AI-provider consent not granted (`blockedByConsent: true`,
            no provider was ever called), or every provider in the failover chain failed
            (`blockedByConsent` absent/false).
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                  providerUsed:
                    type: string
                    enum: [GoogleGemini, OpenAI, Claude, 'NONE']
                  latencyMs:
                    type: number
                  tokensUsed:
                    type: number
                  costUSD:
                    type: number
                  fromFallback:
                    type: boolean
                  blockedByConsent:
                    type: boolean
                    description: Present (`true`) only when tenant AI-provider consent has not been granted.
        '400':
          description: No user message found in `currentMessages`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tts:
    post:
      tags: [AI]
      summary: HTTP text-to-speech (not implemented)
      description: >
        Deliberately fails closed with `501` — previously this endpoint returned an empty audio
        payload with `200`, which made callers believe synthesis had succeeded. Phone-call speech
        synthesis goes through the voice runtime (`lib/voice-runtime/**`), not this HTTP endpoint.
      requestBody:
        required: false
        content:
