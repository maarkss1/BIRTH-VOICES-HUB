  /observability/metrics:
    get:
      tags: [Observability]
      summary: Get OpenTelemetry spans/metrics collected for the tenant
      description: >
        Always filtered by the authenticated caller's own `tenantId` inside the collector —
        `requireTenant` alone only proves the caller is authenticated for *some* tenant, not
        that they own the data returned.
      responses:
        '200':
          description: Spans and metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  spans:
                    type: array
                    items:
                      type: object
                  metrics:
                    type: array
                    items:
                      type: object

  /telephony/twilio/voice:
    post:
      tags: [Telephony]
      summary: Twilio inbound call webhook
      description: >
        Twilio-signed webhook (`X-Twilio-Signature`, validated against `PUBLIC_BASE_URL` +
        `TWILIO_AUTH_TOKEN`), not a session-authenticated route — not for direct SDK use. Body is
        `application/x-www-form-urlencoded`, Twilio's standard call-status payload.
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: TwiML response (starts a `<Gather>` for speech input, or hangs up if the number is unconfigured).
          content:
            text/xml:
              schema:
                type: string
        '403':
          description: Missing or invalid Twilio signature.
        '503':
          description: '`TWILIO_AUTH_TOKEN`/`PUBLIC_BASE_URL` not configured on this deployment.'

  /telephony/twilio/outbound:
    post:
      tags: [Telephony]
      summary: Twilio TwiML webhook for a call placed via `POST /voice/outbound`
      description: >
        Twilio-signed webhook. The session id travels in the query string
        (`?sessionId=...`), set when the call was queued.
      security: []
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: TwiML response.
          content:
            text/xml:
              schema:
                type: string
        '403':
          description: Missing or invalid Twilio signature.
        '503':
          description: '`TWILIO_AUTH_TOKEN`/`PUBLIC_BASE_URL` not configured on this deployment.'

  /telephony/twilio/gather:
    post:
      tags: [Telephony]
      summary: Twilio speech-gather webhook (one per conversation turn)
      description: Twilio-signed webhook.
      security: []
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: TwiML response — continues the conversation, or hangs up on `end` node.
          content:
            text/xml:
              schema:
                type: string
        '403':
          description: Missing or invalid Twilio signature.
        '503':
          description: '`TWILIO_AUTH_TOKEN`/`PUBLIC_BASE_URL` not configured on this deployment.'

  /telephony/twilio/status:
    post:
      tags: [Telephony]
      summary: Twilio call-status callback (call ended)
      description: >
        Twilio-signed webhook. Finalizes the call record and triggers the `agent.call.ended`
        webhook (see `docs/webhooks/index.md`).
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Acknowledged (always 200, even if internal finalization failed — errors are logged, not surfaced to Twilio).
        '403':
          description: Missing or invalid Twilio signature.
        '503':
          description: '`TWILIO_AUTH_TOKEN`/`PUBLIC_BASE_URL` not configured on this deployment.'

  /webhook/atlasgr/outbound:
    post:
      tags: [Webhooks]
      summary: AtlasGR CRM → trigger an outbound prospecting call
      description: >
        Server-to-server webhook, authenticated by a pre-shared secret
        (`X-AtlasGR-Webhook-Secret` header, compared against `ATLASGR_WEBHOOK_SECRET`) rather than
        a user session — mounted before CSRF protection. Idempotent per the underlying call
        request (`AGENTS.md` blocker #11).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                `.strict()` — an unknown field is rejected, not ignored. Source of truth:
                `src/features/prospecting/validators/atlasgr.schema.ts`
                (`atlasGROutboundPayloadSchema`), owned by Agent 06.
              required: [phone_number, name, company]
              properties:
                phone_number:
                  type: string
                  minLength: 8
                  maxLength: 20
                  example: '+5511999998888'
                name:
                  type: string
                  maxLength: 200
                company:
                  type: string
                  maxLength: 200
                lead_id:
                  type: string
                  maxLength: 200
                  description: >
                    Optional and additive — this route's original contract (owned by the sibling
                    AtlasGR repository) did not have this field; it stays optional so a client on
                    the old contract keeps working.
                from:
                  type: string
                  minLength: 8
                  maxLength: 20
      responses:
        '200':
          description: Call triggered.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/invalid shared secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: External AI-provider consent not granted for the configured tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to trigger the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Integration not configured, or idempotency store unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhooks/bland/{token}:
    post:
      tags: [Webhooks]
      summary: Bland AI → call-result callback
      description: >
        Server-to-server webhook. `{token}` is compared against `BLAND_WEBHOOK_TOKEN` (Bland AI's
        outbound-call API takes a plain callback URL with no custom-header support, so the shared
        secret travels in the path instead of a header). Idempotent per `call_id`
        (`AGENTS.md` blocker #11); forwards the result to AtlasGR
        (`ATLASGR_BASE_URL`/api/webhooks/voice-result`) once processed.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Bland AI's real callback body has many more fields; `.passthrough()` keeps
                anything not listed here without rejecting it. Source of truth:
                `src/features/prospecting/validators/atlasgr.schema.ts`
                (`blandCallResultSchema`), owned by Agent 06.
              required: [call_id]
              properties:
                call_id:
                  type: string
                status:
                  type: string
                to:
                  type: string
                concatenated_transcript:
                  type: string
                summary:
                  type: string
                recording_url:
                  type: string
                call_length:
                  type: number
                completed:
                  type: boolean
                variables:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Received (and forwarded, or recognized as a duplicate).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  duplicate:
                    type: boolean
        '400':
          description: Invalid payload.
        '403':
          description: Invalid token.
        '502':
          description: Failed to forward the result to AtlasGR.
        '503':
          description: Integration not configured (missing `ATLASGR_BASE_URL`/`ATLASGR_WEBHOOK_SECRET`), or idempotency store unavailable, or a callback for the same `call_id` is already in flight.

