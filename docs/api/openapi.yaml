  /voice/outbound:
    post:
      tags: [VoiceOutbound]
      summary: Place an Outbound Voice Call
      description: >
        Asks the telephony provider to dial `targetNumber` and hand the answered call to the given
        agent. Returns as soon as the call is queued — the conversation and its result happen
        afterwards, and the outcome is delivered via the `agent.call.ended` webhook (see
        `docs/webhooks/index.md`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, targetNumber]
              properties:
                agentId:
                  type: string
                  format: uuid
                targetNumber:
                  type: string
                  description: Destination number in E.164 format.
                  example: '+5511999998888'
                context:
                  type: object
                  description: >
                    Free-form facts about who is being called. Values are available as
                    `{{placeholder}}` substitutions in the agent's `outboundGreeting` and are
                    echoed back on the `agent.call.ended` webhook for correlation.
                  example:
                    name: João
                    company: Transportadora X
                    leadId: ckv1234
                callbackUrl:
                  type: string
                  format: uri
                  description: >
                    Per-call destination for the `agent.call.ended` webhook, overriding the
                    deployment-wide `WEBHOOK_URL`. Must be HTTPS in production and must not point
                    at a private/reserved/loopback host (SSRF guard) — see `src/validators/index.ts`.
      responses:
        '202':
          description: Call accepted by the telephony provider and queued for dialing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  sessionId:
                    type: string
                    description: Correlates this call with the `agent.call.ended` webhook.
                  callSid:
                    type: string
                  status:
                    type: string
                    example: queued
        '400':
          description: Invalid payload (e.g. `targetNumber` is not E.164, or `callbackUrl` fails the SSRF/HTTPS guard).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such agent for the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A call to this number is already in progress for this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The telephony provider rejected the call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Outbound calling is not configured on this deployment (Twilio not configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

