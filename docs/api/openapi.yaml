  /ai/refactor:
    post:
      tags: [AI]
      summary: AI-refactor a set of workflow nodes
      description: >
        Calls `GoogleGenAI` directly with a fixed prompt per `mode`. Requires tenant AI-provider
        consent. Returns the same `nodes` shape it received, with `data.label`/`data.config`
        rewritten by the model — this is a Studio editing aid, not a validated write to
        `Workflow.nodes` (the client must still call `PUT /workflow` to persist it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, nodes]
              properties:
                mode:
                  type: string
                  enum: [simplify, reduceCost, reduceLatency, moreHuman]
                nodes:
                  type: array
                  items: {}
      responses:
        '200':
          description: Refactored nodes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: {}
        '403':
          description: AI-provider consent not granted for this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gemini API key not configured, or provider error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ai/generate-workflow:
    post:
      tags: [AI]
      summary: Generate a full workflow graph from a natural-language prompt
      description: >
        Calls `GoogleGenAI` directly with a fixed system prompt describing all 12 Studio node
        types. Requires tenant AI-provider consent. The returned graph is a Studio editing aid —
        it is not validated against `ValidationEngine`/runtime capability until the client saves
        and publishes it (`POST /workflow`, `POST /workflow/publish`); several of the documented
        node types are rejected at publish time today, see
        `docs/patterns/workflow-execution-contract.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
      responses:
        '200':
          description: Generated graph.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: {}
                  edges:
                    type: array
                    items: {}
        '403':
          description: AI-provider consent not granted for this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Gemini API key not configured, or provider error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ai/consent:
