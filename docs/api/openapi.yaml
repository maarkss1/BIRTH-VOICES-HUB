openapi: 3.1.0
info:
  title: Birth Voices Hub API
  description: >
    Enterprise API for managing multi-tenant workflows, AI agents, and voice interactions.


    This document is audited directly against `src/routes/**` and the controllers they mount —
    it is the contract as actually implemented, not an aspirational design. See
    `.agents/prompts/09-sdk-contratos-docs.md` for the audit process and `docs/AUDIT.md` for the
    project's living technical-debt record. Endpoints that exist but are not yet functional (e.g.
    `POST /tts`) are documented as such rather than omitted, so a client integrating against this
    spec does not have to rediscover the gap at runtime.
  version: 1.2.0
servers:
  - url: http://localhost:5001/api
    description: Local Development Server
  - url: https://api.birthvoiceshub.com/api
    description: Production Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token issued by `POST /auth/login` or `POST /auth/register`. The browser client
        instead relies on the httpOnly `access_token`/`refresh_token` cookies set on those same
        responses — both mechanisms are accepted by `requireTenant`/`attachAuthIfPresent`, but a
        non-browser SDK client must use the `Authorization: Bearer <token>` header shown here.
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: 'bvhk_live_<secret>'
      description: >
        Global alternative to `bearerAuth`/cookie auth for **any** authenticated route in this
        document, not only the API Keys endpoints below — issued via `POST /developers/keys` and
        sent as `Authorization: Bearer bvhk_live_<secret>`. `getAuthUser`
        (`src/middlewares/index.ts`) resolves a token with this prefix through the API-key path
        instead of JWT verification, and the resulting `req.user`/`req.tenantId` are those of the
        admin who created the key (same tenant, same live role) — not a synthetic identity. A
        revoked or expired key is rejected on the very next request (live database read, never a
        cached/JWT-embedded claim).

  parameters:
    idPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource id (Prisma `cuid`/`uuid` depending on the model).

  responses:
    Unauthorized:
      description: Missing or invalid session (no valid access token/cookie).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated, but the caller's role does not allow this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist for the authenticated tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request body failed schema validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        companyName:
          type: string
        role:
          type: string
          enum: [admin, user]
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    AuthenticatedUser:
      type: object
      description: >
        The shape returned by `GET /auth/me`: the JWT's `TokenPayload` claims (`id`, `email`,
        `role`, `tenantId` — notably narrower than `User`, e.g. no `companyName`/`createdAt`)
        plus `permissions`, resolved live against the database rather than trusted from the
        token (see `src/controllers/auth.controller.ts`). `permissions` is UX-only information
        for the client to decide what to show — every permission-gated action is still enforced
        authoritatively server-side.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
        tenantId:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
          description: Effective permission keys for the caller's role, resolved live (see `getPermissionsForRoleName`).

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    Workflow:
      type: object
      description: >
        `nodes`/`edges` are stored as Prisma `Json` and are intentionally untyped here — the
        real shape (`StudioNode`/`StudioEdge` per node type) is documented in
        `docs/patterns/workflow-execution-contract.md`, not duplicated in the OpenAPI schema,
        because it evolves independently of the HTTP contract.
      properties:
        id:
          type: string
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, active, archived]
          description: >
            Only `POST /workflow/publish` can set this to `active`, and only after
            `ValidationEngine`/`validateRuntimeCompatibility` both pass server-side. Any
            subsequent edit demotes it back to `draft`.
        nodes:
          type: array
          items: {}
        edges:
          type: array
          items: {}
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkflowHistoryEntry:
      type: object
      properties:
        version:
          type: integer
        name:
          type: string
        commitMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        authorId:
          type: string

    PublishedWorkflowVersion:
      type: object
      description: >
        One archived entry of `Workflow.metadata.publishedVersions` — content that was actually
        live at some point, appended only by `POST /workflow/publish` (archiving the version it
        supersedes) and by `POST /workflow/{id}/versions/{version}/rollback` (archiving whatever
        was live immediately before the rollback). Distinct from `WorkflowHistoryEntry`
        (`GET /workflow/history`), which is the pre-existing per-save draft trail and includes
        versions that were never actually published. `nodes`/`edges` are untyped for the same
        reason as `Workflow` — see `docs/patterns/workflow-execution-contract.md`.
      properties:
        version:
          type: integer
        nodes:
          type: array
          items: {}
        edges:
          type: array
          items: {}
        metadata:
          type: object
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
          nullable: true

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        model:
          type: string
        configuration:
          type: object
          description: Free-form agent config (voice/LLM parameters, `knowledge[]` documents, etc).

    KnowledgeDocument:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        keyword:
          type: string
        content:
          type: string
        addedAt:
          type: integer
          format: int64

    RagTestResult:
      type: object
      properties:
        source:
          type: string
        confidence:
          type: number
        isUpToDate:
          type: boolean
        document:
          type: string
        version:
          type: string
        snippetUsed:
          type: string
        embeddingsScore:
          type: number
        isLowConfidence:
          type: boolean
          description: >
            Callers must branch on this field, never infer certainty from `confidence` alone
            (see `AGENTS.md`, Onda 2 mission item 4).

    CallLog:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
          format: uuid
        contactName:
          type: string
        duration:
          type: string
        status:
          type: string
          enum: [Concluído, Falhou]
        agent:
          type: string
        createdAt:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
          format: uuid
        agentId:
          type: string
        channel:
          type: string
        status:
          type: string
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time

    Metric:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: number
        tags:
          type: object
        createdAt:
          type: string
          format: date-time

    AiConsent:
      type: object
      description: Tenant-level consent to send data to external AI providers (LGPD, `AGENTS.md` §16).
      properties:
        granted:
          type: boolean
        grantedAt:
          type: string
          format: date-time
          nullable: true
        grantedByUserId:
          type: string
          nullable: true

    AuditLogEntry:
      type: object
      description: >
        One entry from the tenant's audit trail (`writeAuditLog()` writes these; see
        `src/services/auditLogService.ts`). `action` is a free-form event code, not a closed
        enum — new call sites can introduce new values (e.g. `USER_CREATE_BY_ADMIN`,
        `USER_LOGIN`, `CALL_LOG_CREATE`) without a spec change.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
          description: Id of the user who performed the action, if the action was user-initiated.
        actorEmail:
          type: string
          format: email
          nullable: true
          description: Email of the acting user at read time, resolved via a join; `null` if the user no longer exists.
        action:
          type: string
          description: Machine-readable event code (e.g. `USER_LOGIN`, `CALL_LOG_CREATE`).
        details:
          type: object
          description: Free-form JSON payload specific to `action`.
          nullable: true
        timestamp:
          type: string
          format: date-time

    ApiKeyMetadata:
      type: object
      description: >
        Shape returned by `GET /developers/keys` and by the `apiKey` field of the revoke
        endpoints. Deliberately excludes the hash and the plaintext secret — see
        `src/repositories/apiKeyRepository.ts`'s `API_KEY_SAFE_SELECT`, which never fetches
        `keyHash` in the first place, so there is no code path here that could leak it even by
        accident.
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Set on the key's first successful authenticated request; `null` if never used.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: '`null` means the key never expires.'
        revoked:
          type: boolean
        revokedAt:
          type: string
          format: date-time
          nullable: true

    WebhookEndpointMetadata:
      type: object
      description: >
        Shape returned by `GET /developers/webhooks` and nested in the `webhookEndpoint` field of
        the create/regenerate-secret responses (though those two carry a narrower inline object —
        see the `201`/`200` responses below — because `updatedAt`/`lastDeliveryAt`/
        `lastDeliveryStatus` do not exist yet at creation/rotation time). Deliberately excludes
        `secretHash` and the plaintext secret — see `src/repositories/webhookEndpointRepository.ts`,
        which never selects a column that could leak either.
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          description: Event types this endpoint receives (e.g. `["call.completed"]`), or `["*"]` for all.
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastDeliveryAt:
          type: string
          format: date-time
          nullable: true
        lastDeliveryStatus:
          type: string
          nullable: true

    WalletSummary:
      type: object
      description: >
        A tenant's billing wallet and current plan. The whole object is `null` (not a fabricated
        zero-balance wallet) when the tenant has never been onboarded to billing — see
        `billingService.getWalletSummary`.
      properties:
        tenantId:
          type: string
          format: uuid
        balanceCents:
          type: integer
        currency:
          type: string
        planId:
          type: string
          nullable: true
        planName:
          type: string
          nullable: true
        planStatus:
          type: string
          enum: [inactive, active, past_due, canceled, trialing]
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true

    TransactionSummary:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        amountCents:
          type: integer
          description: Signed — positive is a credit, negative is a debit.
        balanceAfterCents:
          type: integer
        status:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    PlanOption:
      type: object
      description: Global plan catalog entry — the same list for every tenant (per-tenant custom pricing is out of scope).
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        priceCents:
          type: integer
        currency:
          type: string
        billingInterval:
          type: string

    NotificationSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable error code, present on some error paths (e.g. `TTS_HTTP_NOT_IMPLEMENTED`, `AI_PROVIDER_CONSENT_REQUIRED`).
        details:
          type: array
          items:
            type: string
        issues:
          type: array
          description: Present on `422` workflow-publish failures — verbatim `ValidationEngine` issues.
          items:
            type: object

security:
  - bearerAuth: []
  - apiKeyAuth: []

tags:
  - name: Auth
  - name: Workflows
  - name: WorkflowCollaboration
  - name: CallLogs
  - name: Onboarding
  - name: BrandColor
  - name: VoiceRuntime
  - name: VoiceOutbound
  - name: Metrics
  - name: Sessions
  - name: Settings
  - name: Agents
  - name: Knowledge
  - name: Organizations
  - name: Users
  - name: AuditLog
  - name: ApiKeys
  - name: WebhookEndpoints
  - name: Billing
  - name: Notifications
  - name: AI
  - name: Observability
  - name: Telephony
  - name: Webhooks
  - name: Health

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new tenant + admin user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, companyName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                companyName:
                  type: string
                  minLength: 2
      responses:
        '200':
          description: Tenant and admin user created; session cookies set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refreshToken:
                    type: string
                  tenantId:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: User Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successful login; session cookies set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refreshToken:
                    type: string
                  tenantId:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Introspect the current session
      responses:
        '200':
          description: The authenticated user, resolved from the access cookie or bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the current session cookies
      security: []
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the access token using a refresh token
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Refresh token. If omitted, the `refresh_token` cookie is used instead.
      responses:
        '200':
          description: New access token issued; `access_token` cookie updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: No refresh token supplied, or it is invalid/expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workflow:
    get:
      tags: [Workflows]
      summary: Get the tenant's workflow
      description: >
        There is exactly one `Workflow` row per tenant today (single-flow model, not a
        collection) — this is `GET /workflow`, not `GET /workflows`.
      responses:
        '200':
          description: The tenant's workflow, or `null` if none has been saved yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow:
                    oneOf:
                      - $ref: '#/components/schemas/Workflow'
                      - type: 'null'
    post:
      tags: [Workflows]
      summary: Create/save the tenant's workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                nodes:
                  type: array
                  items: {}
                edges:
                  type: array
                  items: {}
                commitMessage:
                  type: string
      responses:
        '200':
          description: Workflow saved (as a new version).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Workflows]
      summary: Update the tenant's workflow
      description: Editing `nodes`/`edges` demotes `status` back to `draft` if it was `active`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                nodes:
                  type: array
                  items: {}
                edges:
                  type: array
                  items: {}
      responses:
        '200':
          description: Workflow updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Workflows]
      summary: Delete the tenant's workflow
      responses:
        '200':
          description: Workflow removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /workflow/history:
    get:
      tags: [Workflows]
      summary: List saved versions of the tenant's workflow
      responses:
        '200':
          description: Version history, most recent first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowHistoryEntry'

  /workflow/restore:
    post:
      tags: [Workflows]
      summary: Restore a previous workflow version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
      responses:
        '200':
          description: Workflow restored to the given version (creates a new current version).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '400':
          description: Missing `version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /workflow/duplicate:
    post:
      tags: [Workflows]
      summary: Duplicate a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId]
              properties:
                sourceId:
                  type: string
      responses:
        '200':
          description: Duplicate created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '404':
          $ref: '#/components/responses/NotFound'

  /workflow/publish:
    post:
      tags: [Workflows]
      summary: Publish the tenant's workflow (flip status to `active`)
      description: >
        The only route that can set `Workflow.status = 'active'`. Runs `ValidationEngine`
        (structural graph validity) and `validateRuntimeCompatibility` (does the telephony
        runtime actually know how to execute every node in this graph) before publishing —
        see `docs/patterns/workflow-execution-contract.md`. This closes `AGENTS.md` blocker #13.
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >
            The graph is well-formed JSON but fails validation (structural or runtime
            capability) — `issues` carries the verbatim `ValidationEngine` findings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workflow/{id}/versions:
    get:
      tags: [Workflows]
      summary: List the published-version archive for a workflow
      description: >
        Every entry that was ever actually live for this workflow (appended by
        `POST /workflow/publish` and by `POST /workflow/{id}/versions/{version}/rollback`,
        archiving whatever it supersedes) — not the per-save draft trail returned by
        `GET /workflow/history`. Tenant-scoped by `req.tenantId`, never by `{id}` alone: a
        workflow belonging to another tenant is indistinguishable from a nonexistent one (`404`),
        so cross-tenant existence can never be inferred from the response shape.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        '200':
          description: Published-version archive, most recent version first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublishedWorkflowVersion'
        '404':
          $ref: '#/components/responses/NotFound'

  /workflow/{id}/versions/{version}/rollback:
    post:
      tags: [Workflows]
      summary: Roll back to a previously published version
      description: >
        Republishes an archived version's `nodes`/`edges` as a **brand new** version — it never
        rewrites the version number that content was originally published under, so history stays
        linear and auditable. Before rolling back, whatever is currently live is itself archived
        as a new `PublishedWorkflowVersion` entry, exactly like a normal `POST /workflow/publish`
        would archive the version it supersedes.

        Goes through the same two publish gates as `POST /workflow/publish`
        (`ValidationEngine` structural check + `validateRuntimeCompatibility`), evaluated against
        the ARCHIVED content, not the current graph — a version that used to be valid can be
        rejected today if the runtime capability it depended on has since been removed (see
        `docs/patterns/workflow-execution-contract.md` §2). A rollback to such a version fails the
        same way a fresh publish of that graph would; it is never applied half-broken.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: The archived version number to roll back to (must exist in that workflow's `publishedVersions` archive).
      responses:
        '200':
          description: Rolled back — republished as a new version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  workflow:
                    $ref: '#/components/schemas/Workflow'
        '400':
          description: '`{version}` is not a positive integer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            The workflow does not exist for this tenant, or `{version}` has no matching entry in
            its published-version archive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The archived version's graph no longer passes validation (structural or runtime
            capability) against the current `ValidationEngine`/runtime — same shape as a rejected
            `POST /workflow/publish`; `issues` carries the verbatim `ValidationEngine` findings.
            The workflow is left unchanged, still on whatever version was live before this call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

